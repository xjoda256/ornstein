dwindle {
  smart_split = true
	use_active_for_splits = true
	precise_mouse_move = true
}

master {
    new_status = master
		mfact = 0.50
}

misc {
  force_default_wallpaper = 0 # 0 or 1 to disable anime wallpapers
  disable_hyprland_logo = true # true disables the anime girl background 
	animate_manual_resizes = true
	animate_mouse_windowdragging = true
}

cursor {
	no_warps = true
	hide_on_key_press = true
}

workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
	name = always-float
	match:class = viewnior|nwg-look|gtk-pipe-viewer|nm-connection-editor|blueman-manager|waypaper|qalculate-gtk|meteo|mpv|xdg-desktop-portal-gtk
	float = on
	center = on
}

