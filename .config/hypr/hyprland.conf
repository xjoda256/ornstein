##################################
## ~/.config/hypr/hyprland.conf ##
## ×Joda™  ######################
##################################

source = input.conf
source = plugins.conf

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto

exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment --all
exec-once = hyprpm reload
exec-once = thunar --daemon
exec-once = kitty --single-instance
exec-once = dms run
exec-once = kdeconnectd
#exec-once = qs -c noctalia-shell

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# permission changes here require a Hyprland restart
# for security reasons

#ecosystem {
#  enforce_permissions = 1
#}
#
#permission = /usr/(bin|local/bin)/grim, screencopy, allow
#permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
#permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

general {
    gaps_in = 04
    gaps_out = 08
    border_size = 02
#    col.active_border = rgba(c4a7e7ff) 45deg
#    col.inactive_border = rgba(363a49ff)
    resize_on_border = true
    allow_tearing = false
    layout = master
}

decoration {
  rounding = 12
#	rounding_power = 01
	dim_inactive = true
	dim_strength = 0.25
	dim_special = 0.75
  active_opacity = 1.00
  inactive_opacity = 1.00
	fullscreen_opacity = 1.00
    shadow {
        enabled = false
        range = 30
        render_power = 5
				offset = 0 5
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 12
        passes = 4
        vibrancy = 1.8500
    }
}

# bezier curves
animations {
	enabled = yes, please :) # ok

# curves

#						NAME,           X0,   Y0,   X1,   Y1
  bezier = easeOutQuint,		0.23, 1.00, 0.32, 1.00
  bezier = easeInOutCubic,	0.65, 0.05, 0.36, 1.00
  bezier = linear,					0.00, 0.00, 1.00, 1.00
  bezier = almostLinear,		0.50, 0.50, 0.75, 1.00
  bezier = quick,						0.15, 0.00, 0.10, 1.00
	bezier = easeInOutCirc,		0.85, 0.00, 0.15, 1.00
	bezier = jodaBounce,			0.85, 1.35, 0.25, 1.00

# animations

#		           NAME,							ONOFF,	SPEED,		CURVE,					[STYLE]
	animation = global,								1,     2.00,		easeInOutCirc
  animation = border,								0,     5.39,		easeOutQuint
  animation = windows,							1,     4.79,		easeOutQuint
  animation = windowsIn,						1,     5.00,		easeInOutCirc,	popin 
  animation = windowsOut,						1,     5.00,		easeInOutCirc,	popin 
  animation = fadeIn,								1,     1.73,		almostLinear
  animation = fadeOut,							1,     1.46,		almostLinear
  animation = fade,									1,     3.03,		jodaBounce
  animation = layers,								1,     3.81,		easeOutQuint
  animation = layersIn,							1,     4.00,		easeOutQuint,		fade
  animation = layersOut,						1,     1.50,		linear,					fade
  animation = fadeLayersIn,					1,     1.79,		almostLinear
  animation = fadeLayersOut,				1,     1.39,		almostLinear
  animation = workspaces,						1,     5.00,		jodaBounce,			fade 
  animation = workspacesIn,					1,     5.00,		jodaBounce,			slide
  animation = workspacesOut,				1,     5.00,		jodaBounce,			slide
  animation = zoomFactor,						1,     7.00,		quick
	animation = specialWorkspaceIn,		1,	   4.00,		easeInOutCirc,	slide top
	animation = specialWorkspaceOut,	1,	   4.00,		easeInOutCirc,	slide bottom
	animation = fadeSwitch,						1,	   5.00,		almostLinear
	animation = fadeDim,							1,     5.00,		almostLinear
	animation = borderangle,					0,	   5.00,		almostLinear,		loop
}

