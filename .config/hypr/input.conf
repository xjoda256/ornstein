##################################
## ~/.config/hypr/input.conf #####
## ×Joda™ ########################
##################################

$terminal = kitty
$fileManager = thunar
$menu = dms ipc call spotlight toggle
$browser = firefox
$screenshot = dms screenshot all -d ~/Pictures/Screenshots/

## input ##
input {
	kb_layout = us
	kb_variant = 
	kb_model =
	kb_options = caps:hyper, compose:ins, shift:both_capslock_cancel
	kb_rules = 
	numlock_by_default = true
	follow_mouse = 2 
	sensitivity = 0.5 # -1.0 to +1.0

	touchpad {
		natural_scroll = true
	}
}

gesture = 3, horizontal, workspace

binds {
	workspace_back_and_forth = true
}

## run apps ##
bind = SUPER,			Return,			exec,		$terminal
bind = SUPER,			f,					exec,		$fileManager
bind = SUPER,			w,					exec,		$browser
bind = ,					Print,			exec,		$screenshot
bind = Mod3,			c,					exec,		qalculate-gtk
bind = Alt Shift, w,					exec,		killall waybar; waybar
bind = ,					f8,					exec,		kitten quick-access-terminal
bind = Mod3,			Space,			exec,		~/bin/wmenu-launcher
bind = Mod3,			b,					exec,		~/bin/hypr-toggle-effects
bind = SUPER,			b,					exec,		dms ipc widget toggle battery
bind = Mod3,			p,					exec,		hyprpicker -la >> docs/colors

## resize windows ##
binde = SUPER Mod3,				left,			resizeactive, -15 0 
binde = SUPER Mod3,				right,		resizeactive, 15 0
binde = SUPER Mod3,				up,				resizeactive, 0 -15
binde = SUPER Mod3,				down,			resizeactive, 0 15
binde = SUPER Mod3 Shift, left,			resizeactive,	-1 0
binde = SUPER Mod3 Shift, right,		resizeactive, 1 0	
binde = SUPER Mod3 Shift, up,				resizeactive,	0 -1
binde = SUPER Mod3 Shift, down,			resizeactive,	0 1
bind  = Alt,							Return,		fullscreen,		0
bind  = Mod3,							Return,		fullscreen,		1

## swap windows ##
bind =	Mod3, Tab, swapnext

## switch workspaces ##
bind = SUPER, bracketright, 	workspace, e+1
bind = SUPER, bracketleft,	 	workspace, e-1
bind = SUPER, Tab,						togglespecialworkspace, special
bind = SUPER, 1,							workspace, 1
bind = SUPER, 2,							workspace, 2
bind = SUPER, 3,							workspace, 3
bind = SUPER, 4,							workspace, 4
bind = SUPER, 5,							workspace, 5
bind = SUPER, 6,							workspace, 6
bind = SUPER, 7,							workspace, 7
bind = SUPER, 8,							workspace, 8
bind = SUPER, 9,							workspace, 9
bind = SUPER, mouse_down,			workspace, e-1
bind = SUPER, mouse_up,				workspace, e+1

## move windows to different workspace ##
bind = Shift Alt, right,	movetoworkspace, e+1
bind = Shift Alt, l,			movetoworkspace, e+1
bind = Shift Alt, h,			movetoworkspace, e-1
bind = Shift Alt, left,		movetoworkspace, e-1
bind = Shift Alt, k,			movetoworkspace, special
bind = Shift Alt, up,			movetoworkspace, special
bind = Shift Alt, 1,			movetoworkspace, 1
bind = Shift Alt, 2,			movetoworkspace, 2
bind = Shift Alt, 3,			movetoworkspace, 3
bind = Shift Alt, 4,			movetoworkspace, 4
bind = Shift Alt, 5,			movetoworkspace, 5
bind = Shift Alt, 6,			movetoworkspace, 6
bind = Shift Alt, 7,			movetoworkspace, 7
bind = Shift Alt, 8,			movetoworkspace, 8
bind = Shift Alt, 9,			movetoworkspace, 9

## move focus ##
bind = SUPER, h,			movefocus, l
bind = SUPER, left,		movefocus, l
bind = SUPER, l,			movefocus, r
bind = SUPER, right,	movefocus, r 
bind = SUPER, j,			movefocus, d
bind = SUPER, down,		movefocus, d
bind = SUPER, k,			movefocus, u
bind = SUPER, up,			movefocus, u

## other ##
bind = SUPER, q, killactive,
bind = SUPER, v, togglefloating,

## dwindle ##
bind = SUPER, p, pseudo,
bind = SUPER, j, layoutmsg, togglesplit
bind = SUPER, k, layoutmsg, swapsplit

## move/resize w/mouse ##
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

## playerctl ##
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause 

## laptop keys ##
bindl = , XF86AudioRaiseVolume,		exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume,		exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute,					exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute,				exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86MonBrightnessUp,		exec, brightnessctl -e4 -n2 set 5%+
bindl = , XF86MonBrightnessDown,	exec, brightnessctl -e4 -n2 set 5%-

## dms ##
# === Application Launchers ===
bind = SUPER, Space,	exec, dms ipc call spotlight toggle
bind = SUPER, l,			exec, dms ipc call lock lock
bind = SUPER, m,			exec, dms ipc call processlist focusOrToggle
bind = SUPER, comma,	exec, dms ipc call settings focusOrToggle
bind = SUPER, n,			exec, dms ipc call notepad toggle
bind = SUPER, y,			exec, dms ipc call dankdash wallpaper
bind = SUPER, c,			exec,	dms ipc call control-center toggle 
bind = SUPER, o,			exec, dms ipc call hypr toggleOverview
bind = SUPER, Escape,	exec, dms ipc call powermenu toggle
bind = SUPER, u,			exec, dms ipc call dash toggle \[tab\]
# bind = SUPER, h,			exec, dms ipc call notifications toggle
# bind = SUPER, p,			exec, dms ipc call clipboard toggle

